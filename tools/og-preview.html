<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #ddd; font-family: Manrope, sans-serif; padding: 24px; }
  /* Полотно 1200×630 — стандарт превью для Telegram, WhatsApp, VK. */
  #og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #fbf9f6; display: flex; }
  .left { flex: 1; padding: 72px 64px 64px 80px; display: flex; flex-direction: column; justify-content: center; }
  .badge { display: inline-block; align-self: flex-start; background: #f6e9e1; color: #8f5a3d; font-weight: 600; font-size: 22px; padding: 10px 20px; border-radius: 999px; margin-bottom: 28px; }
  h1 { margin: 0 0 22px; font-size: 62px; line-height: 1.08; letter-spacing: -0.02em; color: #2f3730; font-weight: 700; }
  h1 em { font-style: normal; color: #6c8f7d; }
  .name { font-size: 26px; color: #2f3730; font-weight: 700; margin-top: 8px; }
  .role { font-size: 22px; color: #6b736c; margin-top: 4px; }
  .site { position: absolute; left: 80px; bottom: 44px; font-size: 22px; color: #557463; font-weight: 600; }
  .photo { width: 470px; height: 630px; object-fit: cover; object-position: center 20%; }
  .fade { position: absolute; right: 470px; top: 0; bottom: 0; width: 80px; background: linear-gradient(to right, #fbf9f6, rgba(251,249,246,0)); }
</style>
</head>
<body>
<div id="og">
  <div class="left">
    <span class="badge">Знакомство — 20 минут онлайн, 500 ₽</span>
    <h1>Выйти из сценария, который <em>повторяется</em> снова и снова</h1>
    <div class="name">Софья Дарвина</div>
    <div class="role">Психолог, гештальт-терапевт · Ростов-на-Дону и онлайн</div>
  </div>
  <div class="site">darwina.ru</div>
  <img class="photo" src="/sofya.jpg" alt="" crossorigin="anonymous" />
</div>

<!-- Иконка сайта: та же монограмма, что и у бота, квадрат без рамки. -->
<svg id="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" width="128" height="128">
  <rect width="512" height="512" rx="112" fill="#6c8f7d"/>
  <text x="256" y="268" text-anchor="middle" dominant-baseline="middle" font-family="Manrope" font-weight="700" font-size="300" fill="#fbf9f6">С</text>
</svg>

<script>
  // OG-картинка: рисуем DOM в canvas по частям (фон, текст, фото), без внешних библиотек.
  window.renderOg = async () => {
    await document.fonts.load('700 54px Manrope');
    await document.fonts.load('600 22px Manrope');
    const c = document.createElement('canvas'); c.width = 1200; c.height = 630;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fbf9f6'; ctx.fillRect(0, 0, 1200, 630);

    // Фото справа
    const img = document.querySelector('.photo');
    await new Promise((r) => (img.complete ? r() : (img.onload = r)));
    // object-fit: cover, object-position: center 20% для 470×630 из 900×1125
    const sw = img.naturalWidth, sh = img.naturalHeight;
    const scale = Math.max(430 / sw, 630 / sh);
    const dw = sw * scale, dh = sh * scale;
    const dx = 770 + (430 - dw) / 2, dy = (630 - dh) * 0.2;
    ctx.drawImage(img, dx, dy, dw, dh);
    // Мягкий переход к фону
    const g = ctx.createLinearGradient(690, 0, 770, 0);
    g.addColorStop(0, '#fbf9f6'); g.addColorStop(1, 'rgba(251,249,246,0)');
    ctx.fillStyle = g; ctx.fillRect(690, 0, 80, 630);

    // Бейдж
    const badge = 'Знакомство — 20 минут онлайн, 500 ₽';
    ctx.font = '600 22px Manrope';
    const bw = ctx.measureText(badge).width + 40;
    ctx.fillStyle = '#f6e9e1';
    roundRect(ctx, 80, 92, bw, 46, 23); ctx.fill();
    ctx.fillStyle = '#8f5a3d'; ctx.textBaseline = 'middle'; ctx.fillText(badge, 100, 115);

    // Заголовок в 3 строки
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 54px Manrope';
    const lines = [['Выйти из сценария,', '#2f3730'], ['который ', '#2f3730', 'повторяется', '#6c8f7d'], ['снова и снова', '#2f3730']];
    let y = 226;
    for (const l of lines) {
      let x = 80;
      for (let i = 0; i < l.length; i += 2) { ctx.fillStyle = l[i + 1]; ctx.fillText(l[i], x, y); x += ctx.measureText(l[i]).width; }
      y += 62;
    }
    // Имя и роль
    ctx.fillStyle = '#2f3730'; ctx.font = '700 26px Manrope'; ctx.fillText('Софья Дарвина', 80, 470);
    ctx.fillStyle = '#6b736c'; ctx.font = '500 22px Manrope'; ctx.fillText('Психолог, гештальт-терапевт · Ростов-на-Дону и онлайн', 80, 506);
    // Домен
    ctx.fillStyle = '#557463'; ctx.font = '600 22px Manrope'; ctx.fillText('darwina.ru', 80, 580);
    return c.toDataURL('image/jpeg', 0.9);
  };
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  // Иконка сайта: спираль (как у бота) на скруглённом шалфейном квадрате.
  const SPIRAL = [[320,250],[326,249],[331,249],[337,249],[343,250],[349,250],[355,252],[360,254],[366,257],[372,260],[377,263],[382,267],[387,272],[391,276],[395,282],[399,287],[402,293],[405,300],[408,306],[409,313],[411,320],[412,327],[412,334],[411,342],[410,349],[409,357],[406,364],[404,371],[400,378],[396,385],[392,392],[386,398],[381,403],[374,409],[368,414],[361,418],[353,422],[345,425],[337,428],[329,430],[320,431],[311,432],[302,432],[293,431],[284,430],[275,428],[267,425],[258,421],[250,417],[242,412],[234,406],[227,400],[220,393],[214,385],[208,377],[203,369],[198,360],[194,350],[192,340],[189,330],[188,320],[187,310],[187,299],[188,288],[190,278],[193,267],[197,257],[201,247],[206,238],[212,228],[219,219],[227,211],[235,203],[244,196],[253,189],[264,184],[274,179],[285,174],[296,171],[308,169],[320,167],[332,167],[344,167],[356,168],[368,171],[380,174],[392,178],[404,184],[415,190],[425,197],[435,205],[445,213],[454,223],[462,233],[469,244],[476,256],[481,268],[486,280],[489,293],[492,306],[494,320],[494,334],[494,348],[492,361],[489,375],[485,388],[480,402],[474,414],[467,427],[459,439],[450,450],[440,461],[429,470],[418,480],[405,488],[392,495],[379,501],[365,506],[350,510],[335,513],[320,514],[305,515],[289,514],[274,512],[259,509],[244,504],[229,499],[215,492],[201,484],[188,475],[175,465],[164,454],[153,442],[143,428],[134,415],[126,400],[120,385],[114,370],[110,353],[107,337],[105,320]]; // точки в системе 640×640
  window.renderIcon = async (size) => {
    const c = document.createElement('canvas'); c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const s = size / 640;
    ctx.fillStyle = '#6c8f7d'; roundRect(ctx, 0, 0, size, size, 140 * s); ctx.fill();
    ctx.strokeStyle = '#fbf9f6'; ctx.lineWidth = 44 * s; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    SPIRAL.forEach(([x, y], i) => (i ? ctx.lineTo(x * s, y * s) : ctx.moveTo(x * s, y * s)));
    ctx.stroke();
    const [ex, ey] = SPIRAL[SPIRAL.length - 1];
    ctx.fillStyle = '#f6e9e1'; ctx.beginPath(); ctx.arc(ex * s, ey * s, 32 * s, 0, Math.PI * 2); ctx.fill();
    return c.toDataURL('image/png');
  };
</script>
</body>
</html>
