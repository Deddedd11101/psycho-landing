# Конфиг nginx: раздаёт собранный фронтенд и проксирует /api в Node-приложение.
# Устанавливается скриптом deploy/setup-server.sh в /etc/nginx/sites-available/psycho
#
# Для HTTPS после привязки домена: замените server_name и выполните
#   certbot --nginx -d ваш-домен.ru
# certbot сам допишет ssl-секцию и редирект с http.

server {
    listen 80;
    listen [::]:80;
    # Подставляется скриптом установки: IP сервера или домен.
    server_name __SERVER_NAME__;

    root /opt/psycho/frontend/dist;
    index index.html;

    # Сжатие текстовых ответов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Заголовки безопасности.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API и вебхук Telegram — в Node.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 200k;
    }

    # Собранные ассеты с хешем в имени — кешируем надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой другой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
