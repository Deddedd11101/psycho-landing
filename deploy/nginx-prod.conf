# Боевой конфиг nginx для darwina.ru (лежит на сервере в /etc/nginx/sites-available/psycho).
#
# Канонический адрес — https://darwina.ru. Всё остальное редиректит на него:
#   http://*            → https://darwina.ru
#   https://www.darwina.ru, https://85-92-110-33.sslip.io → https://darwina.ru
#
# Сертификаты выпущены certbot'ом: /etc/letsencrypt/live/darwina.ru (darwina.ru + www)
# и /etc/letsencrypt/live/85-92-110-33.sslip.io (старый адрес, чтобы старые ссылки
# открывались без предупреждения браузера и уходили на домен).

# ---------- Основной сайт ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name darwina.ru;

    ssl_certificate /etc/letsencrypt/live/darwina.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darwina.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/psycho/frontend/dist;
    index index.html;

    # Сжатие текстовых ответов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Заголовки безопасности.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API и вебхук Telegram — в Node.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 200k;
    }

    # Собранные ассеты с хешем в имени — кешируем надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Mini App специалиста (открывается из Telegram).
    location = /app {
        try_files /app.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    # SPA: любой другой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- www → без www ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.darwina.ru;

    ssl_certificate /etc/letsencrypt/live/darwina.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darwina.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://darwina.ru$request_uri;
}

# ---------- Старый временный адрес → домен ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 85-92-110-33.sslip.io;

    ssl_certificate /etc/letsencrypt/live/85-92-110-33.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/85-92-110-33.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://darwina.ru$request_uri;
}

# ---------- http → https ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name darwina.ru www.darwina.ru 85-92-110-33.sslip.io 85.92.110.33 _;

    # Проверки certbot при продлении сертификатов.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://darwina.ru$request_uri;
    }
}
